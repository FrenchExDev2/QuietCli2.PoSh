name: QuietCli

'on':
  workflow_call:
    outputs:
      module-dir:
        description: Relative path to the canonical runtime module
        value: ${{ jobs.linux.outputs.module-dir }}
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ vars.QUIETCLI_LINUX_IMAGE || 'alpine:3.24' }}
      options: --init
    outputs:
      module-dir: ${{ steps.module.outputs.path }}
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -File {0}
    steps:
      - name: Prepare Git for checkout
        shell: sh
        run: |
          # Objectif : Fournir Git, les certificats et les bibliothèques Node nécessaires avant checkout.
          set -eu
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache git ca-certificates libstdc++
          elif ! command -v git >/dev/null 2>&1; then
            command -v apt-get >/dev/null 2>&1 || { echo 'The Linux image must provide Git or a supported package manager.' >&2; exit 1; }
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
          fi
      - uses: actions/checkout@v4
      - name: Initialize PowerShell 7.6+ Core
        shell: sh
        run: |
          # Objectif : Amorcer PowerShell dans le conteneur avant les étapes utilisant pwsh.
          set -eu
          for root in "$GITHUB_WORKSPACE/PoSh/FrenchExDev/QuietCliEcosystem/FrenchExDev.QuietCli.PoSh" "$GITHUB_WORKSPACE/FrenchExDev.QuietCli.PoSh" "$GITHUB_WORKSPACE"; do
            if [ -f "$root/.github/scripts/Initialize-QuietCliLinux.sh" ]; then
              sh "$root/.github/scripts/Initialize-QuietCliLinux.sh"
              exit 0
            fi
          done
          echo 'QuietCli Linux bootstrap script was not found.' >&2
          exit 1
      - name: Locate canonical runtime sources
        id: module
        run: |
          $candidates = @(
            (Join-Path $env:GITHUB_WORKSPACE 'PoSh/FrenchExDev/QuietCliEcosystem/FrenchExDev.QuietCli.PoSh'),
            (Join-Path $env:GITHUB_WORKSPACE 'FrenchExDev.QuietCli.PoSh'),
            $env:GITHUB_WORKSPACE
          )
          $root = @($candidates | Where-Object { Test-Path (Join-Path $_ 'FrenchExDev.QuietCli.PoSh.psd1') })[0]
          if (!$root) { throw 'Canonical QuietCli runtime sources were not found.' }
          "MODULE_DIR=$root" | Add-Content $env:GITHUB_ENV
          "path=$([IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE,$root))" | Add-Content $env:GITHUB_OUTPUT
      - name: Verify runtime and install test dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSEdition -ne 'Core' -or $PSVersionTable.PSVersion -lt [version]'7.6') {
            throw 'QuietCli requires PowerShell 7.6+ Core.'
          }
          $null = Get-Command git -ErrorAction Stop
          foreach ($dependency in @(
            @{ Name = 'Pester'; Version = '6.2.0' }
            @{ Name = 'PSScriptAnalyzer'; Version = '1.25.0' }
            @{ Name = 'powershell-yaml'; Version = '0.4.12' }
            @{ Name = 'Microsoft.PowerShell.PSResourceGet'; Version = '1.2.0' }
          )) {
            if (!(Get-Module -ListAvailable $dependency.Name | Where-Object Version -EQ $dependency.Version)) {
              Install-Module -Name $dependency.Name -RequiredVersion $dependency.Version -Scope CurrentUser -Repository PSGallery -Force
            }
          }
      - name: Test runtime and canonical Git consumer
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:MODULE_DIR 'test/Invoke-Tests.ps1') -Analyze -OutputPath (Join-Path $env:RUNNER_TEMP 'quietcli-tests.json')
          Import-Module (Join-Path $env:MODULE_DIR 'FrenchExDev.QuietCli.PoSh.psd1') -DisableNameChecking
          $git = Join-Path (Split-Path $env:MODULE_DIR) 'FrenchExDev.QuietCli.Git.PoSh'
          if (Test-Path $git) {
            $result = Test-QuietModule -Path $git -AsObject
            if ($result.Outcome -ne 'Success') { throw ($result.Data.Failures -join '; ') }
            $result | ConvertTo-QuietJson
          }
      - name: Build and verify the standalone runtime ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'quietcli-artifacts'
          & (Join-Path $env:MODULE_DIR 'scripts/New-QuietCliArchive.ps1') -OutputDirectory $out -SourceCommitBase $env:GITHUB_SHA -SourceRef $env:GITHUB_REF_NAME
          & (Join-Path $env:MODULE_DIR 'scripts/Verify-QuietCliArchive.ps1') -ArchivePath (Join-Path $out 'QuietCli.zip') -OutputPath (Join-Path $out 'verification.json')
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quietcli-linux-reports
          path: ${{ runner.temp }}/quietcli-tests.json
          if-no-files-found: error
      - name: Upload workflow-generated distribution
        uses: actions/upload-artifact@v4
        with:
          name: QuietCli-distribution
          path: ${{ runner.temp }}/quietcli-artifacts/*
          if-no-files-found: error
